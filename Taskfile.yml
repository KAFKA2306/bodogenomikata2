version: "3"

tasks:
  default:
    cmd: task --list

  setup:
    cmds:
      - task: setup:backend

  setup:backend:
    cmd: 'uv sync --all-groups && uv run playwright install chromium'

  dev:
    deps: [dev:backend]

  dev:backend:
    cmd: 'PYTHONPATH=backend uv run uvicorn backend.app.main:app --reload --host 0.0.0.0 --port 8000'

  lint:
    cmds:
      - task: lint:backend

  format:
    cmds:
      - 'uv run ruff format backend/app scripts'
      - 'uv run ruff check --fix backend/app scripts'

  lint:backend:
    cmds:
      - 'uv run ruff check --fix backend/app scripts'
      - 'uv run ruff format backend/app scripts'

  ontology:validate:
    desc: 'Validate the murder-mystery ontology, mappings, vocabulary, and example record'
    cmds:
      - 'uv run python scripts/validate_murder_mystery_ontology.py'
      - 'uv run python scripts/validate_murder_mystery_creative_ontology.py'

  creativity:ontology-check:
    desc: 'Validate the evidence-bounded creative-analysis ontology and example profile'
    cmd: 'uv run python scripts/validate_murder_mystery_creative_ontology.py'

  creativity:analyze:
    desc: 'Generate title-surface creative signals for the 100-work murder-mystery corpus'
    cmd: 'uv run python scripts/analyze_murder_mystery_creativity.py'

  creativity:check:
    desc: 'Validate the 100-work creative analysis without writing generated data'
    cmd: 'uv run python scripts/analyze_murder_mystery_creativity.py --check'

  work:new:
    desc: 'Create one stable original-work directory: task work:new -- slug "title"'
    cmd: 'uv run python scripts/create_original_murder_mystery.py {{.CLI_ARGS}}'

  work:validate:
    desc: 'Validate the minimal project layout, human authorship policy, and spoiler boundary'
    cmd: 'uv run python scripts/validate_original_murder_mystery_workspace.py'

  clean:
    ignore_error: true
    cmds:
      - 'find . -type d -name "__pycache__" -exec rm -rf {} +'
      - 'rm -rf .ruff_cache'

  kill:
    ignore_error: true
    cmds:
      - 'fuser -k 8000/tcp'

  test:
    cmd: 'PYTHONPATH=backend uv run python -m pytest backend/tests/ -v'

  verify:
    desc: 'Verify ontologies, original-work structure, and the existing pipeline'
    cmds:
      - task: ontology:validate
      - task: work:validate
      - 'cd backend && uv run python verify_total_pipeline.py'
