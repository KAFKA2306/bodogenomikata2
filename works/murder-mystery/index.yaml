schemaVersion: 2
id: kafka:original-murder-mystery-workspace
purpose: 人間主体のオリジナル・マーダーミステリーを、作品ごとの固定パスと最小限のファイルで管理する。
projectRoot: works/murder-mystery/projects
templateRoot: works/murder-mystery/_template
statuses:
  seed:
    purpose: 人間が原初の観察、執着、問いを記録する。
  developing:
    purpose: 人物、因果、起承転結、謎、驚き、感情を統合する。
  playtesting:
    purpose: 実際のプレイヤー体験を観測して改稿する。
  production:
    purpose: 頒布版、素材、運用、クレジットを固定する。
  archived:
    purpose: 凍結、破棄、他作品への統合理由を残す。
requiredTrackedProjectFiles:
  - project.yaml
  - README.md
requiredLocalPrivateFiles:
  - private/WORK.md
  - private/PLAYTESTS.md
privacy:
  defaultIgnoredPathPattern: works/murder-mystery/projects/*/private/
  spoilerMaterialLocation: private/
  trackedSpoilerOptIn:
    requiredProjectFields:
      trackedSpoilers: true
      spoilerMaterialTrackedInThisRepository: true
      publicationApprovedByOwner: true
    requiredGitignoreExceptions:
      - "!works/murder-mystery/projects/{slug}/private/"
      - "!works/murder-mystery/projects/{slug}/private/**"
  forbiddenTrackedContentWithoutOptIn:
    - culprit
    - truth
    - handout body
    - private objectives
    - ending details
humanAuthorshipPolicy:
  canonicalPlotGenerationByAI: prohibited
  requiredHumanDecisions:
    - human_seed
    - ethical_contradiction
    - character_lives_and_wants
    - truth_and_causality
    - central_surprise
    - climax_choice
    - ending
    - final_prose_and_dialogue
  allowedAIAssistance:
    - organization
    - consistency_check
    - research_assistance
    - provenance_management
    - playtest_summarization
    - comparison_and_checklists
legacyPathsForbidden:
  - works/murder-mystery/00-inbox
  - works/murder-mystery/10-incubating
  - works/murder-mystery/20-developing
  - works/murder-mystery/30-playtesting
  - works/murder-mystery/40-production
  - works/murder-mystery/90-archived
  - works/murder-mystery/_templates
