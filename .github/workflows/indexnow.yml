name: IndexNow changed URLs

on:
  workflow_run:
    workflows: ["Validate play and research modes"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      SITE_ORIGIN: https://bodogenomikata2.pages.dev
    steps:
      - name: Checkout master history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: IndexNow not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "INDEXNOW_KEY is not configured; skipping IndexNow submission."

      - name: Submit changed game URLs
        if: env.INDEXNOW_KEY != ''
        working-directory: frontend
        run: node scripts/submit-indexnow.mjs HEAD^ HEAD
