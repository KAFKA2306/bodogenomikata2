name: Validate play and research modes

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/uiux-modes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Repair stale lock file once
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lock file
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock is already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore: synchronize frontend package lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies from repaired lock
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Validate mode and evidence contracts
        run: |
          grep -q 'path="/play"' frontend/src/App.tsx
          grep -q 'path="/install"' frontend/src/App.tsx
          grep -q 'path="/research"' frontend/src/App.tsx
          grep -q '確認済みの回答が登録されていません' frontend/src/pages/PlayModePage.tsx
          grep -q '指定版' frontend/src/pages/PlayModePage.tsx
          grep -q 'source_documents' frontend/src/types/game.ts
          grep -q 'review_status' frontend/src/types/game.ts
          grep -q 'spoiler_level' frontend/src/types/game.ts
          grep -q 'min-height: 44px' frontend/src/workflow.css
          grep -q 'kafka-signal-v1.0.0' frontend/public/kafka-signal.lock.json
          grep -q 'answer-sequence' frontend/src/kafka-signal.css
          grep -q '公式ルール' frontend/src/components/KafkaSignalRuntime.tsx
