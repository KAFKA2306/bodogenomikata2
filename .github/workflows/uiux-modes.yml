name: Validate play and research modes

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".serena/**"
      - ".github/workflows/uiux-modes.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".serena/**"
      - ".github/workflows/uiux-modes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Test rule evidence scope
        run: node frontend/scripts/test-rule-answer-scope.mjs

      - name: Validate documentation layout
        run: |
          test ! -e .serena/memories
          unexpected="$(find . -type f -name '*.md' \
            -not -path './docs/*' \
            -not -path './README.md' \
            -not -path './AGENTS.md' \
            -not -path './CLAUDE.md' \
            -not -path './.agents/skills/*/SKILL.md' \
            -not -path './frontend/node_modules/*' \
            -print)"
          if [ -n "$unexpected" ]; then
            printf '一般ドキュメントはdocs/へ置いてください:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Validate mode and evidence contracts
        run: |
          grep -q 'path="/play"' frontend/src/App.tsx
          grep -q 'path="/install"' frontend/src/App.tsx
          grep -q 'path="/research"' frontend/src/App.tsx
          grep -q '確認済みの回答が登録されていません' frontend/src/ruleAnswerResolver.ts
          grep -q '指定版' frontend/src/ruleAnswerResolver.ts
          grep -q 'language' frontend/src/ruleAnswerResolver.ts
          grep -q 'source_documents' frontend/src/types/game.ts
          grep -q 'review_status' frontend/src/types/game.ts
          grep -q 'spoiler_level' frontend/src/types/game.ts
          grep -q 'min-height: 44px' frontend/src/workflow.css
          grep -q 'kafka-signal-v1.0.0' frontend/public/kafka-signal.lock.json
          grep -q 'answer-sequence' frontend/src/kafka-signal.css
          grep -q '公式ルール' frontend/src/components/KafkaSignalRuntime.tsx

      - name: Validate game detail layout contract
        run: |
          grep -q "className='detail-card detail-sidebar'" frontend/src/pages/GameDetailPage.tsx
          grep -q "className='detail-main'" frontend/src/pages/GameDetailPage.tsx
          grep -q 'grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);' frontend/src/detail-layout.css
          grep -q '@media (max-width: 900px)' frontend/src/detail-layout.css
          grep -q 'min-width: 0;' frontend/src/detail-layout.css
          grep -q '.product-shell .product-header::after' frontend/src/detail-layout.css
          grep -q "import './detail-layout.css';" frontend/src/App.tsx

      - name: Validate game detail accessibility contract
        run: |
          grep -q "role='status'" frontend/src/pages/GameDetailPage.tsx
          grep -q "aria-busy='true'" frontend/src/pages/GameDetailPage.tsx
          grep -q "className='loader-spinner' aria-hidden='true'" frontend/src/pages/GameDetailPage.tsx
          grep -q "aria-hidden='true' focusable='false'" frontend/src/pages/GameDetailPage.tsx
          grep -q "alt={hasGameImage ? displayTitle : ''}" frontend/src/pages/GameDetailPage.tsx
          grep -q "<dl className='game-meta detail-sidebar-meta'>" frontend/src/pages/GameDetailPage.tsx
          grep -q '<dt><span aria-hidden=' frontend/src/pages/GameDetailPage.tsx
          grep -q '<dd>' frontend/src/pages/GameDetailPage.tsx
