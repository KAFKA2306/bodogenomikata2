name: Validate Palworld card database

on:
  push:
    branches: [master]
    paths:
      - "backend/app/palworld_router.py"
      - "backend/app/services/palworld_card_service.py"
      - "backend/scripts/import_palworld_cards.py"
      - "backend/scripts/verify_palworld_repository_ratchet.py"
      - "backend/tests/test_palworld_card_db.py"
      - "data/palworld/**"
      - "frontend/src/pages/PalworldCardSearchPage.tsx"
      - "frontend/src/pages/palworld-card-search.css"
      - "frontend/src/App.tsx"
      - "frontend/src/components/ProductShell.tsx"
      - ".github/workflows/palworld-card-db.yml"
      - ".github/workflows/weekly-repo-research.yml"
  pull_request:
    paths:
      - "backend/app/palworld_router.py"
      - "backend/app/services/palworld_card_service.py"
      - "backend/scripts/import_palworld_cards.py"
      - "backend/scripts/verify_palworld_repository_ratchet.py"
      - "backend/tests/test_palworld_card_db.py"
      - "data/palworld/**"
      - "frontend/src/pages/PalworldCardSearchPage.tsx"
      - "frontend/src/pages/palworld-card-search.css"
      - "frontend/src/App.tsx"
      - "frontend/src/components/ProductShell.tsx"
      - ".github/workflows/palworld-card-db.yml"
      - ".github/workflows/weekly-repo-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Unit tests
        run: PYTHONPATH=.:backend uv run pytest backend/tests/test_palworld_card_db.py -q

      - name: Import official BP01 snapshot
        run: |
          PYTHONPATH=.:backend uv run python backend/scripts/import_palworld_cards.py \
            --expected-cards 100 \
            --expected-printings 161

      - name: Validate generated snapshot
        run: |
          PYTHONPATH=.:backend uv run python - <<'PY'
          from app.services.palworld_card_service import load_snapshot
          snapshot = load_snapshot()
          manifest = snapshot["manifest"]
          audit = snapshot["audit"]
          assert len(snapshot["cards"]) == 100
          assert len(snapshot["printings"]) == 161
          assert manifest["logical_card_count"] == 100
          assert manifest["printing_count"] == 161
          assert manifest["product_spec_printing_count"] == 161
          assert manifest["english_api_unique_bp01_printings"] == 161
          assert audit["product_spec_vs_unique_api_delta"] == 0
          assert not audit["duplicate_card_ids"]
          assert not audit["duplicate_printing_ids"]
          assert not audit["orphan_printings"]
          assert audit["official_api_duplicate_bp01_record_count"] == 0
          print(manifest)
          PY

      - name: Verify provenance and search ratchet
        run: PYTHONPATH=.:backend uv run python backend/scripts/verify_palworld_repository_ratchet.py

      - name: Upload canonical snapshot
        uses: actions/upload-artifact@v7
        with:
          name: palworld-bp01-canonical
          path: data/palworld/bp01
          if-no-files-found: error

      - name: Verify clean checkout
        run: |
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=all)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Verify clean checkout
        run: |
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=all)"
