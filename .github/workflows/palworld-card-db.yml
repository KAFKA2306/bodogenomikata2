name: Validate Palworld card database

on:
  pull_request:
    paths:
      - "backend/app/palworld_router.py"
      - "backend/app/services/palworld_card_service.py"
      - "backend/scripts/import_palworld_cards.py"
      - "backend/tests/test_palworld_card_db.py"
      - "data/palworld/**"
      - "frontend/src/pages/PalworldCardSearchPage.tsx"
      - "frontend/src/pages/palworld-card-search.css"
      - "frontend/src/App.tsx"
      - "frontend/src/components/ProductShell.tsx"
      - ".github/workflows/palworld-card-db.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect committed canonical snapshot
        id: committed-snapshot
        run: |
          if test -f data/palworld/bp01/manifest.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Unit tests
        run: PYTHONPATH=.:backend uv run pytest backend/tests/test_palworld_card_db.py -q

      - name: Import official BP01 snapshot
        run: |
          PYTHONPATH=.:backend uv run python backend/scripts/import_palworld_cards.py \
            --expected-cards 100 \
            --expected-printings 161

      - name: Validate generated snapshot
        run: |
          PYTHONPATH=.:backend uv run python - <<'PY'
          from app.services.palworld_card_service import load_snapshot
          snapshot = load_snapshot()
          manifest = snapshot["manifest"]
          audit = snapshot["audit"]
          assert len(snapshot["cards"]) == 100
          assert len(snapshot["printings"]) == 161
          assert manifest["logical_card_count"] == 100
          assert manifest["printing_count"] == 161
          assert manifest["product_spec_printing_count"] == 161
          assert manifest["english_api_unique_bp01_printings"] == 161
          assert audit["product_spec_vs_unique_api_delta"] == 0
          assert not audit["duplicate_card_ids"]
          assert not audit["duplicate_printing_ids"]
          assert not audit["orphan_printings"]
          assert audit["official_api_duplicate_bp01_record_count"] == 0
          print(manifest)
          PY

      - name: Upload canonical snapshot
        uses: actions/upload-artifact@v4
        with:
          name: palworld-bp01-canonical
          path: data/palworld/bp01
          if-no-files-found: error

      - name: Commit initial canonical snapshot
        if: >-
          github.event_name == 'pull_request' &&
          steps.committed-snapshot.outputs.present == 'false' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/palworld/bp01
          git commit -m "data: add Palworld BP01 canonical snapshot"
          git push origin "HEAD:$HEAD_REF"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
