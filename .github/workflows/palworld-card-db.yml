name: Validate Palworld card database

on:
  pull_request:
    paths:
      - "backend/app/palworld_router.py"
      - "backend/app/services/palworld_card_service.py"
      - "backend/scripts/import_palworld_cards.py"
      - "backend/tests/test_palworld_card_db.py"
      - "data/palworld/**"
      - "frontend/src/pages/PalworldCardSearchPage.tsx"
      - "frontend/src/pages/palworld-card-search.css"
      - "frontend/src/App.tsx"
      - "frontend/src/components/ProductShell.tsx"
      - ".github/workflows/palworld-card-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Unit tests
        run: PYTHONPATH=backend uv run pytest backend/tests/test_palworld_card_db.py -q

      - name: Import official BP01 snapshot
        run: |
          PYTHONPATH=backend uv run python backend/scripts/import_palworld_cards.py \
            --expected-cards 100 \
            --expected-printings 161

      - name: Validate generated snapshot
        run: |
          PYTHONPATH=backend uv run python - <<'PY'
          from app.services.palworld_card_service import load_snapshot
          snapshot = load_snapshot()
          assert len(snapshot["cards"]) == 100
          assert len(snapshot["printings"]) == 161
          assert not snapshot["audit"]["duplicate_card_ids"]
          assert not snapshot["audit"]["duplicate_printing_ids"]
          assert not snapshot["audit"]["orphan_printings"]
          print(snapshot["manifest"])
          PY

      - name: Upload canonical snapshot
        uses: actions/upload-artifact@v4
        with:
          name: palworld-bp01-canonical
          path: data/palworld/bp01
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
